<header class="header">
  <div class="contenedor header-interno">
    <a routerLink="/" class="logo">🍹 Mojo<span>jitos</span></a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Menú</a>
      <a routerLink="/carrito" class="btn-carrito">
        🛒
        @if (carrito.cantidadTotal() > 0) {
          <span class="badge">{{ carrito.cantidadTotal() }}</span>
        }
      </a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <div class="contenedor">
    <p>© {{ anio }} {{ nombre }} · Pedidos por WhatsApp 💬</p>
  </div>
</footer>
